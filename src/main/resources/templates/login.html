<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - College Network &amp; IP Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-5" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="text-center mb-4">
                    <span class="badge bg-primary px-3 py-2 mb-2 fs-6">Engineering College Intranet</span>
                    <h3 class="fw-bold text-dark mb-1">Network &amp; IP Management</h3>
                    <p class="text-muted small">Secure Administrator Authentication Portal</p>
                </div>

                <div class="card form-card shadow-sm border-0 p-4">
                    <!-- Error / Success Alert -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small" role="alert">
                        <strong>Login Failed:</strong> <span th:text="${errorMessage}">Invalid username or password.</span>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small" role="alert">
                        <span th:text="${successMessage}">Logged out successfully.</span>
                    </div>

                    <!-- Pure HTML5 Form Submission (No JavaScript) -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Administrator Username</label>
                            <input type="text" id="username" name="username" class="form-control" 
                                   placeholder="Enter admin username" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" 
                                   placeholder="Enter password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold">Sign In to Dashboard</button>
                        </div>
                    </form>

                    <!-- Default Credentials Helper Card -->
                    <div class="alert alert-info py-2 px-3 mb-0 small border-0">
                        <div class="fw-bold mb-1">System Default Credentials:</div>
                        <div>Username: <code>admin</code></div>
                        <div>Password: <code>admin123</code></div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">&copy; 2026 College Network Systems &bull; Pure HTML5/Bootstrap Architecture</p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
