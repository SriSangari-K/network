# ===================================================================
# Network Device and IP Address Management System Configuration
# ===================================================================

server.port=8080
spring.application.name=network-mgmt-system

# Active profile: default to 'h2' for zero-setup execution, or switch to 'mysql'
spring.profiles.active=h2

# -------------------------------------------------------------------
# Primary Database Configuration: MySQL
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/college_network_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Thymeleaf Template Engine (Server-Side HTML Rendering)
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Session Configuration
# -------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Logging
logging.level.com.college.networkmgmt=INFO
logging.level.org.hibernate.SQL=INFO
